<div style="margin-bottom: 1.5rem;">
    <h2 style="font-size: 1.5rem; font-weight: 700;">Desempenho Detalhado</h2>
    <p style="color: var(--gray-500); font-size: 0.9rem;">Acompanhe sua evolução nos estudos</p>
</div>

<div class="performance-tabs">
    <div class="performance-tab active" (click)="switchTab('geral')">Geral</div>
    <div class="performance-tab" (click)="switchTab('disciplinas')">Disciplinas</div>
    <div class="performance-tab" (click)="switchTab('topicos')">Tópicos</div>
</div>

<div class="dashboard-grid">
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">Desempenho por Disciplina</h3>
        </div>
        <div class="subject-performance">
            <div class="subject-row">
                <span class="subject-name">Direito Constitucional</span>
                <div class="subject-bar-container">
                    <div class="subject-bar-fill high" style="width: 72%"></div>
                </div>
                <span class="subject-value">72%</span>
            </div>
            <div class="subject-row">
                <span class="subject-name">Direito Administrativo</span>
                <div class="subject-bar-container">
                    <div class="subject-bar-fill high" style="width: 65%"></div>
                </div>
                <span class="subject-value">65%</span>
            </div>
            <div class="subject-row">
                <span class="subject-name">Legislação Penal</span>
                <div class="subject-bar-container">
                    <div class="subject-bar-fill medium" style="width: 58%"></div>
                </div>
                <span class="subject-value">58%</span>
            </div>
            <div class="subject-row">
                <span class="subject-name">Informática</span>
                <div class="subject-bar-container">
                    <div class="subject-bar-fill high" style="width: 80%"></div>
                </div>
                <span class="subject-value">80%</span>
            </div>
            <div class="subject-row">
                <span class="subject-name">Português</span>
                <div class="subject-bar-container">
                    <div class="subject-bar-fill medium" style="width: 61%"></div>
                </div>
                <span class="subject-value">61%</span>
            </div>
            <div class="subject-row">
                <span class="subject-name">Raciocínio Lógico</span>
                <div class="subject-bar-container">
                    <div class="subject-bar-fill low" style="width: 45%"></div>
                </div>
                <span class="subject-value">45%</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h3 class="card-title">Evolução</h3>
        </div>
        <div class="evolution-chart">
            <svg viewBox="0 0 400 160" style="width: 100%; height: 100%;">
                <defs>
                    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#2563eb"/>
                        <stop offset="100%" stop-color="#60a5fa"/>
                    </linearGradient>
                    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#2563eb" stop-opacity="0.2"/>
                        <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
                    </linearGradient>
                </defs>
                <line x1="0" y1="40" x2="400" y2="40" stroke="#e2e8f0" stroke-width="1"/>
                <line x1="0" y1="80" x2="400" y2="80" stroke="#e2e8f0" stroke-width="1"/>
                <line x1="0" y1="120" x2="400" y2="120" stroke="#e2e8f0" stroke-width="1"/>
                <path d="M 0,120 L 50,100 L 100,90 L 150,70 L 200,60 L 250,50 L 300,35 L 350,25 L 400,20 L 400,160 L 0,160 Z" fill="url(#areaGrad)"/>
                <path d="M 0,120 L 50,100 L 100,90 L 150,70 L 200,60 L 250,50 L 300,35 L 350,25 L 400,20" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="0" cy="120" r="4" fill="#2563eb"/>
                <circle cx="50" cy="100" r="4" fill="#2563eb"/>
                <circle cx="100" cy="90" r="4" fill="#2563eb"/>
                <circle cx="150" cy="70" r="4" fill="#2563eb"/>
                <circle cx="200" cy="60" r="4" fill="#2563eb"/>
                <circle cx="250" cy="50" r="4" fill="#2563eb"/>
                <circle cx="300" cy="35" r="4" fill="#2563eb"/>
                <circle cx="350" cy="25" r="4" fill="#2563eb"/>
                <circle cx="400" cy="20" r="4" fill="#2563eb"/>
            </svg>
            <div class="evolution-labels">
                <span>01/05</span>
                <span>05/05</span>
                <span>10/05</span>
            </div>
        </div>
        <div style="margin-top: 2rem;">
            <button class="btn btn-primary" style="width: 100%;">
                📊 Exportar Relatório
            </button>
        </div>
    </div>
</div>
