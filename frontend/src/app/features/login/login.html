<!-- LOGIN SCREEN -->
<div class="login-container">
    <div class="login-card fade-in">
        <!-- ... logo ... -->

        <form (ngSubmit)="onSubmit()">
            <div *ngIf="erro" class="alert alert-danger">
                {{ erro }}
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" class="form-control" placeholder="seu@email.com" [(ngModel)]="email"
                    name="email" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" class="form-control" placeholder="••••••••" [(ngModel)]="senha"
                    name="senha" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" [disabled]="carregando">
                {{ carregando ? 'Entrando...' : 'Entrar' }}
            </button>

        </form>

        <div class="login-footer">
            Não tem conta? <a routerLink="/cadastro" style="cursor: pointer;">Cadastre-se</a>
        </div>
        <!-- ... footer ... -->
    </div>
</div>
