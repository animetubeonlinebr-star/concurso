# =========================================================
# APLICAÇÃO
# =========================================================
spring.application.name=concursos
server.port=8080

# =========================================================
# PERFIL ATIVO
# =========================================================
spring.profiles.active=dev

# =========================================================
# BANCO DE DADOS (PostgreSQL)
# =========================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/concursos
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================================================
# FLYWAY
# =========================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# =========================================================
# JACKSON
# =========================================================
# ⚠️ Spring Boot 4 + Jackson 3: write-dates-as-timestamps NÃO existe mais.
# Datas já vêm ISO-8601 por padrão (não precisa configurar).
spring.jackson.default-property-inclusion=non_null

# =========================================================
# UPLOAD DE ARQUIVOS
# =========================================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# =========================================================
# EDITAL / IMPORTACAO
# =========================================================
# Similaridade minima (Jaccard sobre tokens) para sinalizar possiveis
# materias/topicos duplicados. Apenas sinaliza: nada e mesclado sozinho.
edital.duplicidade.limiar=0.7

# =========================================================
# JWT
# =========================================================
jwt.secret=${JWT_SECRET:dev-secret-apenas-para-desenvolvimento-nao-usar-em-producao-1234567890}
jwt.expiration=${JWT_EXPIRATION:900000}

# =========================================================
# LOGS
# =========================================================
logging.level.root=INFO
logging.level.br.com.marcosbassetto.concursos=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE